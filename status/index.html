<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffebee;
            transition: background-color 0.4s ease;
        }
 
        #status-box {
            font-size: 2rem;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 10px;
            border: 4px solid #c62828;
            background-color: white;
            text-transform: lowercase;
            min-width: 200px;
            text-align: center;
            color: #c62828;
            transition: all 0.4s ease;
        }
 
        #toggle-btn {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 36px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background-color: #c62828;
            color: white;
            transition: background-color 0.4s ease, transform 0.1s ease;
        }
 
        #toggle-btn:hover {
            opacity: 0.85;
        }
 
        #toggle-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
 
    <div id="status-box">status: off</div>
    <button id="toggle-btn">Включить</button>
 
    <script>
        let isOn = false;
 
        const statusBox = document.getElementById('status-box');
        const btn = document.getElementById('toggle-btn');
 
        function updateUI() {
            if (isOn) {
                statusBox.textContent = 'status: on';
                statusBox.style.color = '#2e7d32';
                statusBox.style.borderColor = '#2e7d32';
                document.body.style.backgroundColor = '#e8f5e9';
                btn.style.backgroundColor = '#2e7d32';
                btn.textContent = 'Выключить';
            } else {
                statusBox.textContent = 'status: off';
                statusBox.style.color = '#c62828';
                statusBox.style.borderColor = '#c62828';
                document.body.style.backgroundColor = '#ffebee';
                btn.style.backgroundColor = '#c62828';
                btn.textContent = 'Включить';
            }
        }
 
        btn.addEventListener('click', () => {
            isOn = !isOn;
            updateUI();
        });
    </script>
 
</body>
</html>
